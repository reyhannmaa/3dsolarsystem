<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System - Group 2</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Kaca (Glassmorphism) */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }
        .header { padding: 25px; color: white; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        .header h1 { margin: 0; font-size: 2.5rem; letter-spacing: 3px; font-weight: 800; text-transform: uppercase; }
        .header p { margin: 5px 0 0 0; font-size: 1rem; opacity: 0.9; color: #b8c6db; }
        
        /* Panel Info */
        #info-panel {
            position: absolute; right: -420px; top: 50%; transform: translateY(-50%);
            width: 360px; max-height: 85vh; overflow-y: auto;
            background: linear-gradient(135deg, rgba(10, 12, 20, 0.9), rgba(5, 5, 8, 0.95));
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 35px; transition: right 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto; border-radius: 24px 0 0 24px; box-shadow: -10px 0 40px rgba(0,0,0,0.9);
        }
        
        #info-panel::-webkit-scrollbar { width: 6px; }
        #info-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        #info-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        #info-panel.active { right: 0; }
        #info-title { font-size: 2.2rem; margin-top: 0; margin-bottom: 5px; color: #64f3d5; text-shadow: 0 0 15px rgba(100,243,213,0.4);}
        #info-subtitle { font-size: 0.9rem; color: #a0aec0; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; letter-spacing: 1px;}
        
        .info-item { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.05); padding-bottom: 8px;}
        .info-label { font-size: 0.8rem; color: #777; text-transform: uppercase; letter-spacing: 1px;}
        .info-value { font-size: 1.05rem; font-weight: 600; text-align: right; color: #eee;}
        
        .info-description { margin-top: 25px; font-size: 0.95rem; line-height: 1.7; color: #ccc; text-align: justify; }

        .close-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 12px 15px; border-radius: 8px; cursor: pointer;
            margin-top: 30px; width: 100%; transition: all 0.3s;
            font-weight: bold; letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
        }
        .close-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        /* Loading Screen */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #010103; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999; transition: opacity 0.8s;
            pointer-events: auto;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid #64f3d5;
            border-radius: 50%; width: 60px; height: 60px; animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite; margin-bottom: 25px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            #info-panel {
                width: 100%; right: 0; bottom: -100%; top: auto; transform: none; max-height: 60vh;
                border-radius: 20px 20px 0 0; border-left: none; border-top: 1px solid rgba(255,255,255,0.2);
                transition: bottom 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            }
            #info-panel.active { bottom: 0; right: 0; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <h2 id="loading-text" style="letter-spacing: 2px; font-weight: 300;">MEMASUKI LUAR ANGKASA...</h2>
    </div>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="header">
            <h1>Sistem Tata Surya</h1>
            <p>Eksplorasi ruang angkasa interaktif. Klik planet untuk Info Rinci.</p>
        </div>
        
        <div id="info-panel">
            <h2 id="info-title">Nama Planet</h2>
            <div id="info-subtitle">Data Astronomi</div>
            
            <div class="info-item"><span class="info-label">Jenis</span><span class="info-value" id="info-type">-</span></div>
            <div class="info-item"><span class="info-label">Jarak Orbit</span><span class="info-value" id="info-distance">-</span></div>
            <div class="info-item"><span class="info-label">Diameter</span><span class="info-value" id="info-radius">-</span></div>
            <div class="info-item"><span class="info-label">Massa</span><span class="info-value" id="info-mass">-</span></div>
            <div class="info-item"><span class="info-label">Suhu Permukaan</span><span class="info-value" id="info-temp">-</span></div>
            
            <div class="info-description" id="info-desc"></div>
            <button class="close-btn" id="close-btn">Kembali ke Orbit</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); 
        scene.fog = new THREE.FogExp2(0x000000, 0.00015);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 160, 260);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 0.85; 
        
        container.appendChild(renderer.domElement);
        const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 4000;
        controls.minDistance = 5;
        
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);
        }, 1500);

        const ambientLight = new THREE.AmbientLight(0x080812, 0.3); 
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xfff7e6, 2.2, 4000, 1.5);
        scene.add(sunLight);

        function createGlowingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const starTexture = createGlowingTexture();

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            
            context.font = 'bold 36px "Segoe UI", Arial, sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            
            context.shadowColor = 'rgba(0, 0, 0, 0.9)';
            context.shadowBlur = 8;
            context.shadowOffsetX = 2;
            context.shadowOffsetY = 2;
            
            context.fillStyle = 'rgba(255, 255, 255, 0.95)';
            context.fillText(text, 128, 64);
            
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(22, 11, 1); 
            
            return sprite;
        }

        const galaxyGeometry = new THREE.BufferGeometry();
        const galaxyCount = 8000;
        const galPos = new Float32Array(galaxyCount * 3);
        const galColors = new Float32Array(galaxyCount * 3);
        
        for(let i = 0; i < galaxyCount; i++) {
            const i3 = i * 3;
            const radius = 500 + Math.random() * 3000;
            const theta = Math.random() * Math.PI * 2;
            const ySpread = (Math.random() - 0.5) * (Math.random() * 400);
            
            galPos[i3] = Math.cos(theta) * radius;
            galPos[i3+1] = ySpread;
            galPos[i3+2] = Math.sin(theta) * radius;
            
            const color = new THREE.Color();
            const randColor = Math.random();
            if(randColor > 0.8) color.setHex(0x4a235a); 
            else if(randColor > 0.5) color.setHex(0x154360); 
            else if(randColor > 0.3) color.setHex(0x6e2c00); 
            else color.setHex(0x1a252c); 

            galColors[i3] = color.r; galColors[i3+1] = color.g; galColors[i3+2] = color.b;
        }
        galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galPos, 3));
        galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(galColors, 3));
        
        const galaxyMaterial = new THREE.PointsMaterial({
            size: 30, map: starTexture, vertexColors: true, 
            transparent: true, opacity: 0.15, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const galaxyMesh = new THREE.Points(galaxyGeometry, galaxyMaterial);
        scene.add(galaxyMesh);

        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 4000;
        const posArray = new Float32Array(starsCount * 3);
        const colorArray = new Float32Array(starsCount * 3);
        const sizeArray = new Float32Array(starsCount);
        
        for(let i = 0; i < starsCount; i++) {
            const i3 = i * 3;
            const r = 800 + Math.random() * 3000;
            const u = Math.random(); const v = Math.random();
            const theta = u * 2.0 * Math.PI; const phi = Math.acos(2.0 * v - 1.0);
            
            posArray[i3] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i3+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i3+2] = r * Math.cos(phi);
            
            const colorType = Math.random();
            const color = new THREE.Color();
            if (colorType > 0.9) color.setHex(0xaaccff); 
            else if (colorType > 0.7) color.setHex(0xffd0a0); 
            else color.setHex(0xffffff); 
            
            colorArray[i3] = color.r; colorArray[i3+1] = color.g; colorArray[i3+2] = color.b;
            sizeArray[i] = Math.random() * 6 + 2;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizeArray, 1));
        
        const starsMaterial = new THREE.PointsMaterial({ 
            map: starTexture, vertexColors: true, transparent: true, opacity: 0.8, 
            sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const starsMesh = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starsMesh);

        const sunGlowMat = new THREE.SpriteMaterial({
            map: starTexture, color: 0xffaa00, transparent: true, 
            opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const sunGlow = new THREE.Sprite(sunGlowMat);
        sunGlow.scale.set(70, 70, 1); 
        scene.add(sunGlow);

        const planetMeshes = [];
        let selectedPlanet = null;

        const planetsData = [
            { id: 'sun', name: 'Sun', type: 'Bintang Utama', color: 0xffcc33, radius: 15, distance: 0, speed: 0, mass: '1.989 × 10^30 kg', temp: '5.500 °C (Permukaan)', textureMap: 'sunmap.jpg', desc: 'Pusat tata surya kita. Bola plasma raksasa yang menyala terang benderang.' },
            { id: 'mercury', name: 'Merkurius', type: 'Planet Terestrial', color: 0x888888, radius: 1.5, distance: 30, speed: 0.02, mass: '3.301 × 10^23 kg', temp: '167 °C', textureMap: 'mercurymap.jpg', desc: 'Planet terkecil dan terdekat dari Matahari.' },
            { id: 'venus', name: 'Venus', type: 'Planet Terestrial', color: 0xe3bb76, radius: 3.5, distance: 45, speed: 0.015, mass: '4.867 × 10^24 kg', temp: '462 °C', textureMap: 'venusmap.jpg', desc: 'Planet terpanas di tata surya akibat efek rumah kaca ekstrem.' },
            { id: 'earth', name: 'Bumi', type: 'Planet Terestrial', color: 0x2b82c9, radius: 4, distance: 62, speed: 0.012, mass: '5.972 × 10^24 kg', temp: '15 °C', textureMap: 'earthmap.jpg', nightMap: 'earthnightmap.jpg', desc: 'Satu-satunya tempat di alam semesta yang diketahui mendukung kehidupan.' },
            { id: 'mars', name: 'Mars', type: 'Planet Terestrial', color: 0xc1440e, radius: 2.5, distance: 80, speed: 0.01, mass: '6.39 × 10^23 kg', temp: '-65 °C', textureMap: 'marsmap.jpg', desc: 'Dikenal sebagai "Planet Merah" karena besi oksida (karat) di permukaannya.' },
            { id: 'jupiter', name: 'Jupiter', type: 'Raksasa Gas', color: 0xd39c7e, radius: 9, distance: 120, speed: 0.005, mass: '1.898 × 10^27 kg', temp: '-110 °C', textureMap: 'jupitermap.jpg', desc: 'Planet terbesar dengan badai raksasa tak berujung.' },
            { id: 'saturn', name: 'Saturnus', type: 'Raksasa Gas', color: 0xe3d599, radius: 7.5, distance: 165, speed: 0.003, mass: '5.683 × 10^26 kg', temp: '-140 °C', hasRings: true, textureMap: 'saturnmap.jpg', ringMap: 'saturnringmap.png', desc: 'Memiliki sistem cincin paling megah dan kompleks.' },
            { id: 'uranus', name: 'Uranus', type: 'Raksasa Es', color: 0xa1c6cc, radius: 5.5, distance: 210, speed: 0.002, mass: '8.681 × 10^25 kg', temp: '-195 °C', hasRings: true, ringTilt: 0, textureMap: 'uranusmap.jpg', ringMap: 'saturnringmap.png', desc: 'Berputar dengan kemiringan ekstrem, tampak menggelinding di orbitnya.' },
            { id: 'neptune', name: 'Neptunus', type: 'Raksasa Es', color: 0x2957a3, radius: 5.3, distance: 250, speed: 0.001, mass: '1.024 × 10^26 kg', temp: '-200 °C', textureMap: 'neptunemap.jpg', desc: 'Planet terjauh, dilanda angin supersonik terekstrem di tata surya.' }
        ];

        function createSolarSystem() {
            planetsData.forEach((data) => {
                let material;
                
                if (data.id === 'sun') {
                    material = new THREE.MeshBasicMaterial({ color: data.color });
                } else {
                    material = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8, metalness: 0.05 });
                }

                if (data.textureMap) {
                    const img = new Image();
                    img.onload = function() {
                        const texture = new THREE.Texture(img);
                        texture.encoding = THREE.sRGBEncoding;
                        texture.anisotropy = maxAnisotropy;
                        texture.needsUpdate = true;
                        
                        material.map = texture;
                        material.color = new THREE.Color(0xffffff); 
                        material.needsUpdate = true;
                    };
                    img.src = data.textureMap;
                }

                if (data.nightMap) {
                    const nImg = new Image();
                    nImg.onload = function() {
                        const nTex = new THREE.Texture(nImg);
                        nTex.encoding = THREE.sRGBEncoding;
                        nTex.anisotropy = maxAnisotropy;
                        nTex.needsUpdate = true;
                        
                        material.emissiveMap = nTex;
                        material.emissive = new THREE.Color(0xffffff);
                        material.emissiveIntensity = 0.5; 
                        material.needsUpdate = true;
                    };
                    nImg.src = data.nightMap;
                }

                const geometry = new THREE.SphereGeometry(data.radius, 64, 64);
                const mesh = new THREE.Mesh(geometry, material);
                
                const orbitObj = new THREE.Object3D();
                scene.add(orbitObj);
                orbitObj.add(mesh);
                
                mesh.position.x = data.distance;
                
                const labelSprite = createTextSprite(data.name);
                scene.add(labelSprite); 
                
                mesh.userData = { 
                    ...data, 
                    orbitObj: orbitObj, 
                    labelSprite: labelSprite, 
                    angle: Math.random() * Math.PI * 2,
                    normalSpeed: data.speed,
                    normalRotationSpeed: data.id === 'sun' ? 0.005 : 0.02
                };
                planetMeshes.push(mesh);

                if (data.distance > 0) {
                    const pathGeometry = new THREE.RingGeometry(data.distance - 0.1, data.distance + 0.1, 128);
                    const pathMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.05 });
                    const pathMesh = new THREE.Mesh(pathGeometry, pathMaterial);
                    pathMesh.rotation.x = Math.PI / 2;
                    scene.add(pathMesh);
                }

                if (data.hasRings) {
                    const innerRadius = data.radius * 1.5;
                    const outerRadius = data.radius * 2.5;
                    const ringGeo = new THREE.RingGeometry(innerRadius, outerRadius, 128);
                    
                    const pos = ringGeo.attributes.position;
                    const uv = ringGeo.attributes.uv;
                    for (let i = 0; i < pos.count; i++) {
                        const x = pos.getX(i);
                        const y = pos.getY(i);
                        const radius = Math.sqrt(x * x + y * y);
                        const u = (radius - innerRadius) / (outerRadius - innerRadius);
                        uv.setXY(i, u, 1); 
                    }

                    const ringMat = new THREE.MeshBasicMaterial({ 
                        color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 1.0 
                    });

                    if (data.ringMap) {
                        const ringImg = new Image();
                        ringImg.onload = function() {
                            const ringTex = new THREE.Texture(ringImg);
                            ringTex.encoding = THREE.sRGBEncoding;
                            ringTex.needsUpdate = true;
                            ringMat.map = ringTex;
                            ringMat.needsUpdate = true;
                        }
                        ringImg.src = data.ringMap;
                    }

                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = data.ringTilt !== undefined ? data.ringTilt : Math.PI / 2;
                    mesh.add(ringMesh);
                }
            });
        }

        createSolarSystem();

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // --- LOGIKA MOUSE DRAG UNTUK PUTAR PLANET SAAT DI-HIGHLIGHT ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            if(e.target.closest('#info-panel')) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            if (selectedPlanet) {
                // Jika planet sedang di-highlight, putar planetnya saja 360 derajat ke segala arah
                selectedPlanet.rotation.y += deltaX * 0.005;
                selectedPlanet.rotation.x += deltaY * 0.005;
            }

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        window.addEventListener('click', (event) => {
            if(event.target.id === 'close-btn' || event.target.closest('#info-panel')) return;
            
            // Hitung jarak geser mouse untuk membedakan antara klik murni atau drag putar planet
            const moveDist = Math.hypot(event.clientX - previousMousePosition.x, event.clientY - previousMousePosition.y);
            if (moveDist > 3 && isDragging) return; 

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planetMeshes);
            
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                selectedPlanet = clickedMesh;
                
                const pData = clickedMesh.userData;
                document.getElementById('info-title').innerText = pData.name;
                document.getElementById('info-type').innerText = pData.type;
                document.getElementById('info-distance').innerText = pData.id === 'sun' ? 'Pusat Tata Surya' : pData.distance + ' Juta KM (Skala)';
                document.getElementById('info-radius').innerText = pData.radius + ' (Skala)';
                document.getElementById('info-mass').innerText = pData.mass;
                document.getElementById('info-temp').innerText = pData.temp;
                document.getElementById('info-desc').innerText = pData.desc;
                
                document.getElementById('info-panel').classList.add('active');
            } else {
                selectedPlanet = null;
                document.getElementById('info-panel').classList.remove('active');
            }
        });

        document.getElementById('close-btn').addEventListener('click', () => {
            selectedPlanet = null;
            document.getElementById('info-panel').classList.remove('active');
        });

        const targetCameraPos = new THREE.Vector3();
        
        function animate() {
            requestAnimationFrame(animate);

            galaxyMesh.rotation.y += 0.0001;
            starsMesh.rotation.y += 0.00005;

            planetMeshes.forEach(mesh => {
                const data = mesh.userData;
                
                let currentOrbitSpeed = data.normalSpeed;
                let currentRotationSpeed = data.normalRotationSpeed;
                
                if (selectedPlanet === mesh) {
                    currentOrbitSpeed = 0; // Hentikan orbit agar kamera zoom in stabil
                    // Jika sedang tidak didrag mouse, putar pelan otomatis di sumbu Y
                    if (!isDragging) {
                        mesh.rotation.y += 0.002;
                    }
                } else if (selectedPlanet !== null) {
                    currentOrbitSpeed = data.normalSpeed * 0.1;
                    mesh.rotation.y += currentRotationSpeed;
                } else {
                    mesh.rotation.y += currentRotationSpeed;
                }

                if (data.id !== 'sun') {
                    data.angle += currentOrbitSpeed;
                    mesh.position.x = Math.cos(data.angle) * data.distance;
                    mesh.position.z = Math.sin(data.angle) * data.distance;
                }
                
                if (data.labelSprite) {
                    data.labelSprite.position.x = mesh.position.x;
                    data.labelSprite.position.z = mesh.position.z;
                    data.labelSprite.position.y = mesh.position.y + data.radius + 4;
                }
            });

            if (selectedPlanet) {
                const targetPos = new THREE.Vector3();
                selectedPlanet.getWorldPosition(targetPos);
                
                let directionToSun = targetPos.clone().normalize().negate(); 
                if (selectedPlanet.userData.id === 'sun') { directionToSun = new THREE.Vector3(0, 0, 1); }
                
                directionToSun.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 5);
                
                const distOffset = selectedPlanet.userData.radius * 3.5; 
                
                targetCameraPos.copy(targetPos).add(directionToSun.multiplyScalar(distOffset));
                targetCameraPos.y += selectedPlanet.userData.radius * 0.8; 
                
                const camRight = new THREE.Vector3(1, 0, 0);
                camRight.applyQuaternion(camera.quaternion);
                
                const shiftAmount = selectedPlanet.userData.radius * (window.innerWidth < 768 ? 0 : 1.8); 
                const shiftedTarget = targetPos.clone().add(camRight.multiplyScalar(shiftAmount));
                
                // Kamera dan latar belakang terkunci stabil tanpa terpental
                camera.position.lerp(targetCameraPos, 0.04);
                controls.target.lerp(shiftedTarget, 0.04);
            } else {
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.05);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
